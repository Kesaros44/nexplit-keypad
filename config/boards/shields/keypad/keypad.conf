# BLE Configurations
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# PWM Backlight
CONFIG_ZMK_BACKLIGHT=y

# Poor man's LED indicator — disabled; status LED is now driven directly by
# config/src/keypad_indicator.c (solid on when connected, 1s blink when not)
CONFIG_INDICATOR_LED_WIDGET=n

# Enable PWM LED driver for backlight
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_PWM=y

# TX 파워 상향(기본 0dBm -> +8dBm): 넘버패드는 스플릿이 아니라 라디오
# 경합 문제는 없지만, 호스트와의 연결 마진 자체를 넓혀서 배터리가 낮거나
# 주변 RF 간섭이 있을 때의 안정성을 높이는 목적. KSN-1/2/3에도 같은
# 이유로 적용한 값이고, ZMK 공식 저장소의 다른 nRF52840 보드들(Glove80,
# Kinesis Advantage360 Pro 등)도 이미 쓰고 있음. 트레이드오프는 송신
# 순간 피크 전류 소폭 증가 정도.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE 연결 인터벌 최소화(저지연 실험): macOS 캡스락 짧게 탭했을 때
# 한/영 입력 소스 전환이 가끔 씹히는 문제 대응. ZMK/Zephyr 기본 연결
# 인터벌(30~50ms)로 인한 HID 리포트 왕복 지연이 macOS 자체의
# press/release 타이밍 판별과 어긋나는 것으로 추정, 연결 인터벌을 스펙
# 최소값(7.5ms)으로 낮추고 슬레이브 레이턴시를 0으로 설정 (KSN-1에서
# 먼저 적용, 근거는 KSN-1 저장소 ksn_1_right.conf 주석 참고). 키패드는
# 스플릿이 아니라 단일 보드가 직접 호스트에 연결되므로 이 설정도
# 하나의 conf 파일에만 있으면 됨.
# 트레이드오프: 배터리 소모 소폭 증가.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
