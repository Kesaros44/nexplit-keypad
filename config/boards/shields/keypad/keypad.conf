# BLE Configurations
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# PWM Backlight
CONFIG_ZMK_BACKLIGHT=y

# Poor man's LED indicator — disabled; status LED is now driven directly by
# config/src/keypad_indicator.c (solid on when connected, 1s blink when not)
CONFIG_INDICATOR_LED_WIDGET=n

# Enable PWM LED driver for backlight
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_PWM=y
