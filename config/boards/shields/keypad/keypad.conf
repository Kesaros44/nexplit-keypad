# BLE Configurations
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# PWM Backlight
CONFIG_ZMK_BACKLIGHT=y

# Poor man's LED indicator — disabled; status LED is now driven directly by
# config/src/keypad_indicator.c (solid on when connected, 1s blink when not)
CONFIG_INDICATOR_LED_WIDGET=n

# Enable PWM LED driver for backlight
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_PWM=y

# TX 파워 상향(기본 0dBm -> +8dBm): 넘버패드는 스플릿이 아니라 라디오
# 경합 문제는 없지만, 호스트와의 연결 마진 자체를 넓혀서 배터리가 낮거나
# 주변 RF 간섭이 있을 때의 안정성을 높이는 목적. KSN-1/2/3에도 같은
# 이유로 적용한 값이고, ZMK 공식 저장소의 다른 nRF52840 보드들(Glove80,
# Kinesis Advantage360 Pro 등)도 이미 쓰고 있음. 트레이드오프는 송신
# 순간 피크 전류 소폭 증가 정도.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
